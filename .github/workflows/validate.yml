name: Validate Challenge Roulette

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter((match) => !/\bsrc\s*=/.test(match[1]))
            .map((match) => match[2].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error("No inline application scripts found.");
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error(`Inline script ${index + 1}: ${error.message}`); }
          });
          console.log(`Validated ${scripts.length} inline script(s).`);
          NODE
      - name: Verify static deployment files
        run: |
          test -s index.html
          test -s favicon.svg
          test -s config.js
          test -s schema.sql
          test -s manifest.webmanifest
          test -s sw.js
          test -s vercel.json
          node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'));"
